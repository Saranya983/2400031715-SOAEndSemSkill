
openapi: 3.0.0

info:
  title: Customer Microservice
  version: 1.0.0

paths:
  /customers:
    get:
      summary: Get customer details

      parameters:
        - name: s
          in: query
          required: true
          schema:
            type: integer
            example: 5

        - name: b
          in: query
          required: true
          schema:
            type: integer
            example: 10

      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                    email:
                      type: string

        '400':
          description: Bad request

        '500':
          description: Server error
